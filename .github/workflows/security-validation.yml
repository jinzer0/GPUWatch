name: Security validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: npm ci --ignore-scripts
      - name: Build helper required by the scheduler integration test
        run: cargo +stable build --locked --manifest-path crates/gpuwatcher-helper/Cargo.toml
      - run: npm test
      - run: npm run build && npm run electron:build
      - run: cargo +stable test --locked --manifest-path crates/gpuwatcher-core/Cargo.toml
      - run: cargo +stable test --locked --manifest-path crates/gpuwatcher-helper/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path crates/gpuwatcher-helper/Cargo.toml --all-targets -- -D warnings
